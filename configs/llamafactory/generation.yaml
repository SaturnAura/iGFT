# iGFT -- Pseudo-query generation with the tuned generator
#
# adapter_name_or_path should point to the adapter used for sampling:
#   saves/sft for right after supervised fine-tuning, or
#   saves/ppo for the RL-optimized generator.

model_name_or_path: meta-llama/Llama-2-13b-chat-hf  # TODO: local path or HF model id
adapter_name_or_path: saves/sft
template: llama2
finetuning_type: lora

dataset: fiqa_train
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
