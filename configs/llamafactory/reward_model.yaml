# iGFT -- Reward model training for the PPO stage
#
# The reward dataset (e.g. fiqa_train_rm) must contain chosen/rejected
# response pairs and be registered in data/dataset_info.json.

model_name_or_path: meta-llama/Llama-2-13b-chat-hf  # TODO: local path or HF model id
adapter_name_or_path: saves/sft                     # optional warm start from the SFT adapter

stage: rm
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj

dataset: fiqa_train_rm
template: llama2
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

output_dir: saves/rm
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00001
num_train_epochs: 0.1
lr_scheduler_type: cosine
warmup_steps: 0
fp16: true

val_size: 0.1
per_device_eval_batch_size: 1
evaluation_strategy: steps
eval_steps: 500
