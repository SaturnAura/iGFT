# iGFT -- Supervised fine-tuning of the query generator (low-resource setting)
#
# The sampled training file must exist in LLaMA-Factory's data/ directory and
# its dataset id must be registered in data/dataset_info.json.

model_name_or_path: meta-llama/Llama-2-13b-chat-hf  # TODO: local path or HF model id

stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj

dataset: fiqa_train                 # dataset id registered in dataset_info.json
template: llama2
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

output_dir: saves/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 8.0
lr_scheduler_type: cosine
warmup_steps: 0
fp16: true

val_size: 0.1
per_device_eval_batch_size: 1
evaluation_strategy: steps
eval_steps: 500
